# Generates the cyan-neon 3D isometric contribution graph shown in README.md.
# Docs: https://github.com/yoshi389111/github-profile-3d-contrib
name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * *" # daily @ 18:00 UTC (≈ 23:45 NPT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: 3d-contrib-settings.json

      - name: Commit & Push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A profile-3d-contrib
          if git commit -m "chore: regenerate 3D contribution graph"; then
            git push
          fi
